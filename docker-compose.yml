version: "3.9"

x-bot-base: &bot-base
  image: luigicasino-bot:latest
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped

services:
  bot-dev:
    <<: *bot-base
    container_name: luigicasino-dev
    env_file:
      - .env.dev
    environment:
      APP_ENV: development
    volumes:
      - ./src:/app/src
    command: ["python", "-m", "src.bot"]

  bot-stage:
    <<: *bot-base
    container_name: luigicasino-stage
    env_file:
      - .env.stage
    environment:
      APP_ENV: staging
    command: ["python", "-m", "src.bot"]

  bot-prod:
    <<: *bot-base
    container_name: luigicasino-prod
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
    command: ["python", "-m", "src.bot"]
