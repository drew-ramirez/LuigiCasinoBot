version: "3.9"

x-bot-base: &bot-base
  image: luigicasino-bot:1.0.4
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped

services:
  bot-dev:
    <<: *bot-base
    container_name: luigicasino-dev
    env_file:
      - .env.dev
    environment:
      APP_ENV: development
      CASINO_SESSION_DB: /app/data/casino_sessions.sqlite3
    volumes:
      - ./src:/app/src
      - casino-dev-data:/app/data
    command: ["python", "-m", "src.bot"]

  bot-stage:
    <<: *bot-base
    container_name: luigicasino-stage
    env_file:
      - .env.stage
    environment:
      APP_ENV: staging
      CASINO_SESSION_DB: /app/data/casino_sessions.sqlite3
    volumes:
      - casino-stage-data:/app/data
    command: ["python", "-m", "src.bot"]

  bot-prod:
    <<: *bot-base
    container_name: luigicasino-prod
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      CASINO_SESSION_DB: /app/data/casino_sessions.sqlite3
    volumes:
      - casino-prod-data:/app/data
    command: ["python", "-m", "src.bot"]

volumes:
  casino-dev-data:
  casino-stage-data:
  casino-prod-data:
